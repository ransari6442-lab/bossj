<!-- META PIXEL SUBSCRIBE TRACKING -->
<script>
let clicked = false;

function trackTelegramClick(event){

  if(clicked){
    event.preventDefault();
    return;
  }

  clicked = true;
  event.preventDefault();

  const telegramUrl = event.currentTarget.href;

  if(typeof fbq === "function"){

    fbq('track','Subscribe');

    setTimeout(function(){
      window.open(telegramUrl,'_blank');
      clicked = false;
    },500);

  }else{

    window.open(telegramUrl,'_blank');
    clicked = false;

  }
}
</script>
