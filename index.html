<style>
* {
  margin: 0;
  padding: 0;

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at 50% 30%, #25206a, transparent 45%),
    linear-gradient(135deg,#050510,#10102b,#050510);
}

body::before {
  content: "";
  position: fixed;
  inset: -50%;
  background: conic-gradient(
    transparent,
    #00eaff,
    transparent,
    #ff00cc,
    transparent,
    #ffe600,

  );

  pointer-events: none;
}

@keyframes rotate {

}

.container {
  position: relative;
  width: 90%;
  max-width: 410px;
  text-align: center;
  padding: 45px 20px;
  border-radius: 28px;
  background: rgba(10,10,30,.83);
  border: 1px solid rgba(255,255,255,.16);
  box-shadow: 0 0 45px #6500ff55,
              inset 0 0 25px #00d9ff15;
  z-index: 1;
}

.profile {
  width: 155px;
  height: 155px;
  margin: auto;
  padding: 5px;
  border-radius: 50%;
  background: linear-gradient(135deg,#00f0ff,#ff00d4,#ffe600);
  box-shadow: 0 0 20px #00eaff,
              0 0 45px #b000ff;
  animation: glow 2s infinite alternate;
}

.profile img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #09091c;
}

@keyframes glow {
  from { box-shadow: 0 0 15px #00eaff; }
  to { box-shadow: 0 0 35px #ff00d4,0 0 60px #00eaff; }
}

h1 {

  background: linear-gradient(90deg,#00f5ff,#ff00e6,#ffe600);
  background-size: 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  filter: drop-shadow(0 3px 8px #00d9ff66);
}

@keyframes shine {
  to { background-position: 200%; }
}

.subtitle {
  color: #d7d7ff;
  font-size: 13px;
  letter-spacing: 3px;
  margin-top: 12px;
  font-weight: bold;
}

  background: linear-gradient(90deg,#008cff,#00e5ff,#0077ff);

.telegram:hover {
